[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-model-architect"
version = "1.0.0rc1"
description = "A strict, reference-driven framework that turns AI agents into disciplined, expert ML engineers."
readme = "README.md"
authors = [
    { name = "Ahmed Zain" }
]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.1.0",
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
ml-architect = "scripts.cli:main"
mla = "scripts.cli:main"

[tool.setuptools]
packages = ["scripts"]
