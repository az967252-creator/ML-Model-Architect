[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-model-architect"
version = "1.0.0rc2"
description = "A strict, reference-driven framework that turns AI agents into disciplined, expert ML engineers."
readme = "README.md"
authors = [
    { name = "Ahmed Zain" }
]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.1.0",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
train = [
    "optuna==4.2.1",
    "mlflow==2.20.3",
]
mcp = [
    "mcp>=1.0.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
]
dashboard = [
    "streamlit>=1.30.0",
]
test = [
    "pytest>=7.4.0",
]
dev = [
    "pytest>=7.4.0",
    "build",
    "twine",
]

[project.scripts]
ml-architect = "ml_model_architect.cli:main"
mla = "ml_model_architect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ml_model_architect = ["resources/*"]

[tool.setuptools.exclude-package-data]
ml_model_architect = ["*.pyc", "__pycache__/*", "resources/__pycache__/*"]
