name: Monthly Reference Update

on:
  schedule:
    # Runs at 00:00 on the first day of every month
    - cron: '0 0 1 * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  update-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run SOTA Fetcher
        run: python scripts/fetch_sota.py
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c  # v6.1.0
        with:
          commit-message: "chore: monthly SOTA reference update"
          title: "Automated SOTA Reference Update"
          body: "This PR contains the latest state-of-the-art candidate papers from the last 30 days across all 12 ML groups in references/candidates.yaml. Please review and verify."
          branch: "auto-sota-candidates"
