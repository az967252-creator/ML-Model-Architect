name: Monthly Reference Update

on:
  schedule:
    # Runs at 00:00 on the first day of every month
    - cron: '0 0 1 * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  update-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests
      - name: Run SOTA Fetcher
        run: python scripts/fetch_sota.py
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "chore: monthly SOTA reference update"
          title: "Automated SOTA Reference Update"
          body: "This PR contains the latest state-of-the-art papers from the last month across the 12 ML groups. Please review and merge."
          branch: "auto-sota-update"
