name: Verify References & Skills

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Unit Tests
        run: python -m unittest discover -s tests
      - name: Scan Sandbox
        run: python scripts/scan_sandbox.py
      - name: Verify Plan Template Schema
        run: |
          python scripts/lock_plan.py _shared/TEMPLATE-PLAN-MANIFEST.json
          python scripts/run_policy.py verify _shared/TEMPLATE-PLAN-MANIFEST.json
          python scripts/lock_plan.py --unlock _shared/TEMPLATE-PLAN-MANIFEST.json
          rm -f _shared/TEMPLATE-PLAN-MANIFEST.json.lock
      - name: Run Example Pipelines
        run: |
          python examples/car-price-prediction/train.py
          python examples/delivery-delay-prediction/train.py
          python examples/financial-anomaly-detection/train.py
      - name: Verify DOIs (Relaxed)
        run: python scripts/verify_dois.py
      - name: Enforce Constitution across Examples
        run: |
          for f in examples/*/DECISIONS.md; do
            [ -f "$f" ] && python scripts/enforce_constitution.py "$f" --allow-offline
          done

  sota-pr-guard:
    if: github.head_ref == 'auto-sota-candidates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify SOTA PR only touches candidates.yaml
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files:"
          echo "$CHANGED"
          INVALID=$(echo "$CHANGED" | grep -v '^references/candidates.yaml$' || true)
          if [ -n "$INVALID" ]; then
            echo "::error::SOTA PR touched files beyond references/candidates.yaml"
            exit 1
          fi
          echo "OK: Only candidates.yaml was modified."

  live-network-check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Live DOI Check (Strict)
        id: live
        continue-on-error: true
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: python scripts/verify_dois.py --strict
      - name: Open Issue on Failure
        if: steps.live.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Automated DOI check failed',
              body: 'The weekly live DOI verification found broken or fake DOIs.',
              labels: ['automated', 'reference-check']
            })
