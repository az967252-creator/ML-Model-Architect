name: Verify References & Skills

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Unit Tests
        run: python -m pytest tests -v
      - name: Scan Sandbox
        run: python scripts/scan_sandbox.py
      - name: Lint Hyperparameters & Thresholds
        run: python scripts/lint_references.py
      - name: Verify Plan Template Schema
        run: |
          python scripts/lock_plan.py _shared/TEMPLATE-PLAN-MANIFEST.json
          python scripts/run_policy.py verify _shared/TEMPLATE-PLAN-MANIFEST.json
          MLA_ALLOW_UNLOCK=1 python scripts/lock_plan.py --unlock _shared/TEMPLATE-PLAN-MANIFEST.json
          rm -f _shared/TEMPLATE-PLAN-MANIFEST.json.lock
      - name: Run Example Pipelines
        run: |
          python examples/car-price-prediction/train.py
          python examples/delivery-delay-prediction/train.py
          python examples/financial-anomaly-detection/train.py
          python examples/case-study-churn/train.py
      - name: Verify DOIs (Relaxed)
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08  # v3.0.2
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: python scripts/verify_dois.py --check-md
      - name: Enforce Constitution across Examples
        run: |
          for f in examples/*/DECISIONS.md; do
            [ -f "$f" ] && python scripts/enforce_constitution.py "$f" --allow-offline
          done
      - name: Verify Plan Locks against Git HEAD
        run: |
          for f in examples/*/PLAN.manifest.json; do
            [ -f "$f" ] && python scripts/lock_plan.py --verify-git "$f"
          done
      - name: Verify Plan Status across Examples (Strict)
        run: |
          for f in examples/*/PLAN.manifest.json; do
            [ -f "$f" ] && python scripts/cli.py status "$f" --strict
          done

  verify-wheel:
    name: Verify Wheel Build & Clean Installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: pip install build twine
      - name: Build wheel and sdist
        run: python -m build
      - name: Verify package metadata
        run: python -m twine check dist/*
      - name: Verify in clean venv (no repo on sys.path)
        run: |
          python -m venv /tmp/clean_env
          /tmp/clean_env/bin/pip install dist/*.whl
          (cd /tmp && /tmp/clean_env/bin/mla --version)
          (cd /tmp && /tmp/clean_env/bin/mla init tmp_proj)
          (cd /tmp && /tmp/clean_env/bin/mla scan tmp_proj/sandbox/example_task.py)
          (cd /tmp && /tmp/clean_env/bin/mla enforce tmp_proj/DECISIONS.md --allow-empty)
          (cd /tmp && /tmp/clean_env/bin/mla status tmp_proj/PLAN.manifest.json)

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Build Sandbox Docker Image
        run: docker build -f docker/Dockerfile.sandbox -t mla-sandbox:smoke .
      - name: Smoke Test Sandbox Execution
        run: docker run --rm mla-sandbox:smoke python -c "import numpy, sklearn, xgboost, lightgbm, catboost; print('Docker sandbox smoke OK')"

  sota-pr-guard:
    if: github.head_ref == 'auto-sota-candidates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - name: Verify SOTA PR only touches candidates.yaml
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files:"
          echo "$CHANGED"
          INVALID=$(echo "$CHANGED" | grep -v '^references/candidates.yaml$' || true)
          if [ -n "$INVALID" ]; then
            echo "::error::SOTA PR touched files beyond references/candidates.yaml"
            exit 1
          fi
          echo "OK: Only candidates.yaml was modified."

  live-network-check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Live DOI Check (Strict)
        id: live
        continue-on-error: true
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08  # v3.0.2
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: python scripts/verify_dois.py --strict --check-md
      - name: Enforce Constitution Online (Schedule)
        run: |
          for f in examples/*/DECISIONS.md; do
            [ -f "$f" ] && python scripts/enforce_constitution.py "$f" --online
          done
      - name: Run Behavioral Scenarios (Scheduled)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python tests/behavioral/run_scenarios.py
      - name: Open Issue on Failure
        if: steps.live.outcome == 'failure'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Automated DOI check failed',
              body: 'The scheduled strict DOI verification job failed. Please check the logs.'
            })
