name: Verify References & Skills

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Unit Tests
        run: python -m pytest tests -v
      - name: Scan Sandbox
        run: python scripts/scan_sandbox.py
      - name: Lint Hyperparameters & Thresholds
        run: python scripts/lint_references.py
      - name: Verify Plan Template Schema
        run: |
          python scripts/lock_plan.py _shared/TEMPLATE-PLAN-MANIFEST.json
          python scripts/run_policy.py verify _shared/TEMPLATE-PLAN-MANIFEST.json
          MLA_ALLOW_UNLOCK=1 python scripts/lock_plan.py --unlock _shared/TEMPLATE-PLAN-MANIFEST.json
          rm -f _shared/TEMPLATE-PLAN-MANIFEST.json.lock
      - name: Run Example Pipelines
        run: |
          python examples/car-price-prediction/train.py
          python examples/delivery-delay-prediction/train.py
          python examples/financial-anomaly-detection/train.py
          python examples/case-study-churn/train.py
      - name: Verify DOIs (Relaxed)
        run: python scripts/verify_dois.py --check-md
      - name: Enforce Constitution across Examples
        run: |
          for f in examples/*/DECISIONS.md; do
            [ -f "$f" ] && python scripts/enforce_constitution.py "$f" --allow-offline
          done

  sota-pr-guard:
    if: github.head_ref == 'auto-sota-candidates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - name: Verify SOTA PR only touches candidates.yaml
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files:"
          echo "$CHANGED"
          INVALID=$(echo "$CHANGED" | grep -v '^references/candidates.yaml$' || true)
          if [ -n "$INVALID" ]; then
            echo "::error::SOTA PR touched files beyond references/candidates.yaml"
            exit 1
          fi
          echo "OK: Only candidates.yaml was modified."

  live-network-check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Live DOI Check (Strict)
        id: live
        continue-on-error: true
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab59b242a35c43c5  # v3.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: python scripts/verify_dois.py --strict --check-md
      - name: Enforce Constitution Online (Schedule)
        run: |
          for f in examples/*/DECISIONS.md; do
            [ -f "$f" ] && python scripts/enforce_constitution.py "$f" --online
          done
      - name: Open Issue on Failure
        if: steps.live.outcome == 'failure'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Automated DOI check failed',
              body: 'The scheduled strict DOI verification job failed. Please check the logs.'
            })
