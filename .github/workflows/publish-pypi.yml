name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    name: Build distribution and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ml-model-architect
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: pip install build twine
      - name: Build binary wheel and source tarball
        run: python -m build
      - name: Verify package metadata
        run: python -m twine check dist/*
      - name: Verify package in clean virtual environment
        run: |
          python -m venv /tmp/clean_env
          /tmp/clean_env/bin/pip install dist/*.whl
          (cd /tmp && /tmp/clean_env/bin/mla --version)
          (cd /tmp && /tmp/clean_env/bin/mla init test_scaffold)
          (cd /tmp && /tmp/clean_env/bin/mla scan test_scaffold/sandbox/example_task.py)
          (cd /tmp && /tmp/clean_env/bin/mla enforce test_scaffold/DECISIONS.md --allow-empty)
          (cd /tmp && /tmp/clean_env/bin/mla status test_scaffold/PLAN.manifest.json)
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc  # release/v1.12.4
        with:
          skip-existing: true
